<div class="field{% if field.errors %} field-error{% endif %}{% if wide %} patient-edit-field-wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="patient-edit-required" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
  {{ field.errors }}
</div>
