{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Cams HMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    /* ── Login page overrides ── */
    body { background: var(--bg); }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: var(--card);
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      padding: 44px 40px 40px;
      box-shadow: 0 8px 40px rgba(32,32,36,0.10);
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .login-brand-mark {
      width: 44px;
      height: 44px;
      background: var(--ink);
      border-radius: 14px;
      display: grid;
      place-items: center;
    }
    .login-brand-name { font-size: 22px; font-weight: 800; color: var(--ink); }
    .login-brand-sub  { font-size: 10px; letter-spacing: 1.4px; color: var(--muted); margin-top: 2px; }

    .login-title { font-size: 26px; font-weight: 750; letter-spacing: -0.5px; margin-bottom: 6px; }
    .login-sub   { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

    .login-field { margin-bottom: 18px; }
    .login-field label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .login-field input,
    .login-field select {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
      color: var(--ink);
      transition: border-color 0.15s ease;
    }
    .login-field input:focus,
    .login-field select:focus {
      outline: none;
      border-color: var(--lav-deep);
      box-shadow: 0 0 0 3px var(--lav-soft);
    }

    .login-btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: filter 0.15s ease;
    }
    .login-btn:hover { filter: brightness(1.35); }

    .login-error {
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 12px;
      padding: 0.65rem 1rem;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .login-footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    /* Lime accent line on top of card */
    .login-card::before {
      content: '';
      display: block;
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--lime) 0%, var(--lav) 100%);
      margin-bottom: 36px;
    }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <div class="login-brand-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 10l9-7 5 4-4 4z" fill="#d6f25f"/>
          <path d="M11 9c5-6 11-6 15-2v16H11z" fill="#ffffff"/>
        </svg>
      </div>
      <div>
        <div class="login-brand-name">Cams HMS</div>
        <div class="login-brand-sub">MEDICAL CENTER</div>
      </div>
    </div>

    <h1 class="login-title">Welcome back</h1>
    <p class="login-sub">Sign in to your account to continue.</p>

    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}

      <div class="login-field">
        <label for="id_username">Username</label>
        <input type="text" id="id_username" name="username" autocomplete="username"
               placeholder="Enter your username" required>
      </div>

      <div class="login-field">
        <label for="id_password">Password</label>
        <input type="password" id="id_password" name="password" autocomplete="current-password"
               placeholder="Enter your password" required>
      </div>

      <div class="login-field">
        <label for="id_designation">Designation</label>
        <select id="id_designation" name="designation" required>
          <option value="" disabled selected>Select your designation…</option>
          {% for value, label in designation_choices %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="login-btn">Sign in →</button>
    </form>

    <p class="login-footer">Cams Hospital Management System &nbsp;·&nbsp; v25.10</p>
  </div>
</div>
</body>
</html>
