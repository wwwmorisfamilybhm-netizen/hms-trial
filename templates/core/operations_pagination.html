<div class="ops-page">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&q={{ query|urlencode }}&scope={{ request.GET.scope|urlencode }}&status={{ request.GET.status|urlencode }}&from={{ request.GET.from|urlencode }}&to={{ request.GET.to|urlencode }}">← Previous</a>{% else %}<span></span>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&q={{ query|urlencode }}&scope={{ request.GET.scope|urlencode }}&status={{ request.GET.status|urlencode }}&from={{ request.GET.from|urlencode }}&to={{ request.GET.to|urlencode }}">Next →</a>{% endif %}</div>
